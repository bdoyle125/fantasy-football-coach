name: UI Lint

on:
  push:
    branches: [main]
    paths: ["UI/**"]
  pull_request:
    paths: ["UI/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - run: npm ci

      - run: npx eslint .
